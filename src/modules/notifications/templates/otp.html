<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
            <tr>
              <td style="padding:24px 28px 4px;font-size:18px;font-weight:700;color:#111827;">{{orgName}}</td>
            </tr>
            <tr>
              <td style="padding:8px 28px 24px;color:#374151;font-size:15px;line-height:1.6;">
                <p style="margin:0 0 16px;">Este es tu código de acceso para reservar:</p>
                <div style="margin:8px 0 16px;padding:16px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;">{{code}}</div>
                <p style="margin:0;color:#6b7280;font-size:13px;">El código vence en {{ttlMinutes}} minutos. Si no lo pediste, ignorá este mensaje.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px;border-top:1px solid #f0f0f0;color:#9ca3af;font-size:12px;">Enviado por Agendox</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
